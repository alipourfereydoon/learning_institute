{% extends 'base.html' %}
{% block title %}سوالات متداول | هوش نو{% endblock %}
{% block content %}
<section class="container py-5">
  <h1 class="section-title text-center mb-4">سوالات متداول ❓</h1>
  <div class="row justify-content-center"><div class="col-lg-8">
    {% for q,a in faqs %}
    <div class="accordion-item mb-2 border-0 rounded-3 overflow-hidden">
      <h2 class="accordion-header"><button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#f{{ forloop.counter }}">{{ q }}</button></h2>
      <div id="f{{ forloop.counter }}" class="accordion-collapse collapse"><div class="accordion-body">{{ a }}</div></div>
    </div>
    {% endfor %}
  </div></div>
</section>
{% endblock %}
