{% extends 'base.html' %}
{% block title %}ثبت‌نام | هوش نو{% endblock %}
{% block content %}
<section class="container py-5"><div class="row justify-content-center"><div class="col-md-5">
  <div class="card pastel-modal p-4">
    <h3 class="text-center mb-3">ثبت‌نام 🎉</h3>
    <form method="post">{% csrf_token %}
      <input class="form-control mb-2" name="username" placeholder="نام کاربری" required>
      <input class="form-control mb-2" type="password" name="password" placeholder="رمز عبور" required>
      <input class="form-control mb-2" type="password" name="password2" placeholder="تکرار رمز عبور" required>
      <select class="form-select mb-3" name="role">
        <option value="student">دانش‌آموز</option><option value="parent">والد</option><option value="instructor">مدرس</option>
      </select>
      <button class="btn btn-coral w-100">ایجاد حساب</button>
    </form>
    <p class="text-center small mt-3">حساب داری؟ <a href="{% url 'accounts:login' %}">وارد شو</a></p>
  </div>
</div></div></section>
{% endblock %}
